        trainer: trainer_default
      - model: minmaxrnc__d_(90)__l_(2)__s_(40)__og_true__cv_gated
        trainer: trainer_default
      - model: minmaxrnc__d_(90)__l_(2)__s_(40)__og_false__cv_basic
        trainer: trainer_default
      - model: minmaxrnc__d_(90)__l_(2)__s_(40)__og_false__cv_gated
