# Model configurations.
#
# Each entry defines a named model that can be referenced in experiments.
# The 'class' field must match a class registered via benchmarks.register_model().
# Template parameters are written as {N:int} in keys and {N} in values.
#
# Example (place your model package under models/mymodel/__init__.py):
#
# 'mymodel__layers_{N:int}__small':
#   class: MyModel_LM
#   args:
#     n_blocks: '{N}'
#     d_model: 90
#     d_state: 40

# ------------------------------------------------------------------
# MinMax RNC
# ------------------------------------------------------------------

# Fully parameterised: d_model, n_layers, d_state
'minmaxrnc__d_{D:int}__l_{L:int}__s_{S:int}':
  class: MinMaxRNC_LM
  pretty_name: MinMax
  args:
    n_layers: '{L}'
    d_model: '{D}'
    d_state: '{S}'

# Four architectural variants: output_gate ∈ {True, False} × conv_type ∈ {'basic', 'gated'}
'minmaxrnc__d_{D:int}__l_{L:int}__s_{S:int}__og_true__cv_basic':
  class: MinMaxRNC_LM
  pretty_name: MinMax
  args:
    n_layers: '{L}'
    d_model: '{D}'
    d_state: '{S}'
    output_gate: true
    conv_type: basic

'minmaxrnc__d_{D:int}__l_{L:int}__s_{S:int}__og_true__cv_gated':
  class: MinMaxRNC_LM
  pretty_name: MinMax
  args:
    n_layers: '{L}'
    d_model: '{D}'
    d_state: '{S}'
    output_gate: true
    conv_type: gated

'minmaxrnc__d_{D:int}__l_{L:int}__s_{S:int}__og_false__cv_basic':
