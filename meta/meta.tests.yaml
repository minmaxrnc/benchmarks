# Test groups. Set enabled: false to skip an entire group when running pytest.
#
# Run all enabled groups:   pytest
# Run one file directly:    pytest tests/test_models.py   (ignores this file)
# Enable/disable a group:   flip the enabled flag below

groups:

  meta:
    enabled: true
    description: >
      Template-string compilation and matching, Meta dict lookup and
      parameter substitution, scope loading from YAML.

  factory:
    enabled: true
    description: >
      Factory.instantiate, class registration via add_class / register_model,
      get_meta, get_required_kwargs, repr — across Models, Losses, Metrics
      and Schedulers factories.

  models:
    enabled: true
    description: >
      VanillaRNN construction, forward pass shapes and dtypes,
      weight-decay parameter groups, supports_unroll_steps.

  losses:
    enabled: true
    description: >
      CrossEntropyLoss scalar output, correct loss on known predictions,
      masking behaviour, clone.

  metrics:
    enabled: true
    description: >
      TokenAccuracy perfect / zero accuracy, empty-mask edge case,
      multi-batch accumulation, reset.

  optimizers:
    enabled: true
    description: >
      Adam and AdamW construction from project classes,
      parameter-group counts and weight-decay values.

  schedulers:
    enabled: true
    description: >
      NoneScheduler and StepLR construction, lr-decay after step() calls,
      step-property values.

  integration:
    enabled: true
    description: >
      Synthetic end-to-end training step: model + loss + metric + optimizer.
      Uses in-memory tensors — no saved datasets required.

  datasets:
    enabled: false
    description: >
      Dataset item generation and DataLoader collation.
      Requires pre-generated datasets saved to disk; disabled by default.
